    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #fdfaf6;
        color: #292524;
        font-family: ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: rgba(181, 96, 63, 0.2);
      }
      header {
        border-bottom: 1px solid #e7e5e4;
        background: rgba(255, 255, 255, 0.9);
      }
      .bar {
        max-width: 80rem;
        margin: 0 auto;
        padding: 1rem;
      }
      .logo {
        font-family: Georgia, Cambria, 'Times New Roman', serif;
        font-size: 1.5rem;
        line-height: 2rem;
        letter-spacing: -0.025em;
        color: #1c1917;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem 1rem;
      }
      .card {
        width: 100%;
        max-width: 28rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 0.75rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.25rem;
        border-radius: 9999px;
        background: rgba(181, 96, 63, 0.1);
        color: #b5603f;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-family: Georgia, Cambria, 'Times New Roman', serif;
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 400;
        color: #1c1917;
      }
      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: #57534e;
      }
      .hint {
        margin-top: 1.25rem;
        padding-top: 1.25rem;
        border-top: 1px solid #f5f5f4;
        font-size: 0.8125rem;
        color: #78716c;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar"><span class="logo">Yumbry</span></div>
    </header>
    <main>
      <div class="card">
        <div class="icon" aria-hidden="true">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </div>
        <h1>{{heading}}</h1>
        <p>{{body}}</p>
        <p class="hint">{{hint}}</p>
      </div>
    </main>
  </body>
</html>
