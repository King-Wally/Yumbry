name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace=shared
      - run: npm run lint --workspace=shared
      - run: npm run format:check --workspace=shared
      - run: npm test --workspace=shared
      - run: npm run build --workspace=shared

  backend:
    runs-on: ubuntu-latest
    needs: [shared]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chef
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: recipe_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chef -d recipe_vault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=shared
      - run: npm exec --workspace=backend -- prisma generate
      - run: npm run typecheck --workspace=backend
      - run: npm run lint --workspace=backend
      - run: npm run format:check --workspace=backend
      - run: npm test --workspace=backend
        env:
          TEST_DATABASE_URL: postgres://chef:changeme@localhost:5432/recipe_vault_test
      - run: npm run build --workspace=backend

  frontend:
    runs-on: ubuntu-latest
    needs: [shared]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=shared
      - run: npm run typecheck --workspace=frontend
      - run: npm run lint --workspace=frontend
      - run: npm run format:check --workspace=frontend
      - run: npm test --workspace=frontend
      - run: npm run build --workspace=frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [shared]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chef
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: yumbry_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chef -d yumbry_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace=e2e
      - run: npm run lint --workspace=e2e
      - run: npm run format:check --workspace=e2e
      - run: npm exec --workspace=backend -- prisma generate
      - run: npm run e2e:build
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e
        env:
          E2E_DATABASE_URL: postgres://chef:changeme@localhost:5432/yumbry_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t yumbry:ci .
