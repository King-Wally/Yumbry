name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

jobs:
  app:
    runs-on: ubuntu-latest
    # For the database-backed service tests (*.db.spec.ts), which reset this database.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chef
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: yumbry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chef -d yumbry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx eslint .
      - run: bunx prettier --check .
      # The vitest "client" project runs .svelte tests in a real Chromium. No --with-deps: the
      # runner image already has Chrome's system libraries, and apt mirrors can stall for minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install chromium
      - run: bun run test
        env:
          TEST_DATABASE_URL: postgres://chef:changeme@localhost:5432/yumbry_test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chef
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: yumbry_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chef -d yumbry_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Node runs only Playwright's test runner and the e2e scripts, the only runtime Playwright supports.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: e2e
      - run: bun run lint
        working-directory: e2e
      - run: bun run e2e:build
      - run: bunx playwright install --with-deps chromium
        working-directory: e2e
      # CloakBrowser's ~200 MB binary, downloaded by the e2e prepare step on a cache miss.
      - uses: actions/cache@v4
        with:
          path: ~/.cloakbrowser
          key: cloakbrowser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: cloakbrowser-${{ runner.os }}-${{ runner.arch }}-
      - run: bun run e2e
        env:
          E2E_DATABASE_URL: postgres://chef:changeme@localhost:5432/yumbry_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  docker:
    needs: [app, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chef
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: yumbry_docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chef -d yumbry_docker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: yumbry:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      # The image must migrate an empty database on start and report healthy.
      - name: Smoke test
        run: |
          # Fake values, never real secrets.
          docker run -d --name yumbry --network host \
            -e DATABASE_URL=postgres://chef:changeme@localhost:5432/yumbry_docker \
            -e ORIGIN=http://localhost:3000 \
            -e BETTER_AUTH_SECRET=ci-smoke-test-placeholder-not-a-secret \
            yumbry:ci
          for _ in $(seq 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' yumbry)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' yumbry)" = true ] || break
            sleep 2
          done
          docker logs yumbry
          [ "$status" = healthy ]
          curl -fsS http://localhost:3000/api/health
      # Production is arm64. Emulated, so only on main and release tags.
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v3
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, e2e, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Trigger Coolify deploy
        run: |
          curl --fail-with-body -X POST \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
