services:
  app:
    build: .
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      # Built from the db service's own credentials, so .env's DATABASE_URL can keep pointing at
      # localhost for `vite dev`. POSTGRES_PASSWORD must therefore be URL-safe.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The URL users open (better-auth's base URL, CSRF checks, email links). PORT, NODE_ENV,
      # UPLOADS_DIR and the proxy settings come from the image.
      ORIGIN: ${ORIGIN:?set ORIGIN to the URL users open, e.g. https://recipes.example.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL_BIG: ${AI_MODEL_BIG:-}
      AI_MODEL_MEDIUM: ${AI_MODEL_MEDIUM:-}
      AI_MODEL_SMALL: ${AI_MODEL_SMALL:-}
      AI_MODEL_IMAGE: ${AI_MODEL_IMAGE:-}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-}
      AI_USER_DAILY_BUDGET_USD: ${AI_USER_DAILY_BUDGET_USD:-}
      GEMINI_DAILY_REQUEST_LIMIT: ${GEMINI_DAILY_REQUEST_LIMIT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Real-browser fallback for URL import behind bot challenges. Points at the `browser`
      # sidecar, which always starts with the stack. Set it to an empty string in .env to turn off.
      BROWSER_CDP_URL: ${BROWSER_CDP_URL-http://browser:9222}
      BROWSER_PROXY_HOST: app
    volumes:
      # Same volume as v1.3.1, which mounted it at /app/backend/uploads.
      - uploads_data:/app/uploads
    networks:
      - default
      - browser
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # CloakBrowser (Chromium with its bot tells patched out in the binary) for the URL-import
  # fallback, served over CDP by `cloakserve`. The image's entrypoint runs Xvfb, so the browser
  # is headed, which is harder to detect. Timezone and locale belong to the browser's identity
  # and should match where the server's IP is. The `browser` network is internal: the sidecar
  # has no way out except through the app's SSRF-checking proxy, and no route to Postgres.
  browser:
    image: cloakhq/cloakbrowser:0.5.11
    command:
      - cloakserve
      - --headless=false
      - --fingerprint-timezone=${BROWSER_TIMEZONE:-UTC}
      - --fingerprint-locale=${BROWSER_LOCALE:-en-US}
      # Stop the browser after 10 idle minutes; the next import relaunches it.
      - --idle-timeout=600
    environment:
      CLOAKBROWSER_AUTO_UPDATE: 'false'
    init: true
    shm_size: 512m
    mem_limit: 1g
    networks:
      - browser
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          '--max-time',
          '5',
          '-o',
          '/dev/null',
          'http://127.0.0.1:9222/json/version'
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  default:
  browser:
    internal: true

volumes:
  db_data:
  uploads_data:
